name: Build Achilles Enhanced

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build
        run: gradle build --no-daemon
      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' | head -n 1)
          test -n "$JAR"
          SIZE=$(stat -c%s "$JAR")
          echo "JAR: $JAR ($SIZE bytes)"
          test "$SIZE" -gt 10000
          unzip -l "$JAR" | grep -q 'META-INF/mods.toml'
          unzip -l "$JAR" | grep -q 'com/achilles/Achilles.class'
          unzip -l "$JAR" | grep -q 'com/achilles/entity/AchillesEntity.class'
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: achilles-enhanced
          path: build/libs/*.jar
          if-no-files-found: error
