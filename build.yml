name: Build Achilles

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Limpiar proyecto
        run: gradle clean --no-daemon

      - name: Compilar Achilles
        run: gradle build --no-daemon

      - name: Mostrar archivos generados
        run: |
          echo "=== build/libs ==="
          ls -lah build/libs
          echo ""
          echo "=== contenido de los JAR ==="
          for file in build/libs/*.jar; do
            echo "--- $file ---"
            unzip -l "$file"
          done

      - name: Subir JAR
        uses: actions/upload-artifact@v4
        with:
          name: achilles-build
          path: build/libs/*.jar
